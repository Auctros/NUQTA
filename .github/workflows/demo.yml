name: NUQTA Demo

on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: npm run verify

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          # Pages is static, so it cannot host the sync WebSocket server. Without an
          # endpoint the status pill renders nothing at all, which leaves the header
          # unrepresentative for design review. This draws the pill from a fixed status
          # instead; pick the state with ?syncPreview=ok|busy|warn|danger|muted|paused.
          VITE_NUQTA_SYNC_PREVIEW: '1'

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
