    <script>
      // Compatibility shim for browser extensions (e.g. request interceptors) attempting to overwrite window.fetch
      (function() {
        try {
          const originalFetch = window.fetch;
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get() {
              return currentFetch;
            },
            set(fn) {
              currentFetch = fn;
            }
          });
        } catch (e) {
          // Ignore if environment forbids redefinition
        }
      })();
    </script>
    <script>
      // Apply the saved theme before first paint so the shell never flashes the
      // wrong mode while React boots. Light is the first-run default.
      (function() {
        try {
          var stored = localStorage.getItem('nuqta_profile_v1');
          var theme = 'light';
          if (stored) {
            try {
              var parsed = JSON.parse(stored);
              if (parsed && typeof parsed.theme === 'string') theme = parsed.theme;
            } catch (e) {
              /* unreadable profile: fall back to the light default */
            }
          }
          var isLight = theme === 'light';
          document.documentElement.classList.toggle('light-mode', isLight);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isLight ? '#f4f6f4' : '#0b0f13');
          var syncBody = function() {
            if (document.body) document.body.classList.toggle('light-mode', isLight);
          };
          if (document.body) syncBody();
          else document.addEventListener('DOMContentLoaded', syncBody);
        } catch (e) {
          /* theme is a preference; the app still works without it */
        }
      })();
    </script>
      <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">

    <meta name="theme-color" content="#f4f6f4">
