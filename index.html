    <script>
      // Compatibility shim for browser extensions (e.g. request interceptors) attempting to overwrite window.fetch
      (function() {
        try {
          const originalFetch = window.fetch;
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get() {
              return currentFetch;
            },
            set(fn) {
              currentFetch = fn;
            }
          });
        } catch (e) {
          // Ignore if environment forbids redefinition
        }
      })();
    </script>
